  <!--
    WizCRM mark. WIZAG's own product — copyright Wise & Agile Solutions Ltd,
    so no third-party usage restriction applies.

    Source: Downloads/WizCRM Logo.svg (Illustrator export). One change for web
    use: the full-bleed #f0f0fd canvas rectangle is removed — it made the mark
    a pale box on any coloured ground. The viewBox is tightened to the tile
    (was 0 0 140 131, with dead space and an off-centre mark) so the artwork
    sits flush and centred in the space it is given. Paths are untouched.

    This is a full-colour, opaque app tile — a violet squircle with a light
    lightning bolt — so it reads on light AND dark grounds. Unlike the
    monochrome WIZAG wordmark / AscendBooks mark it needs no -reversed variant.
  -->
